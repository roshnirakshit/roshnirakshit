<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Preview - Roshni Rakshit</title>
  <style>
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    .section {
      margin-bottom: 40px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
    }
    h2 {
      margin-top: 0;
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 8px;
    }
    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="section">
      <h2>1. Main Animated Banner (Dark Mode)</h2>
      <img src="dark.svg" alt="Dark Banner">
    </div>

    <div class="section" style="background: #ffffff; color: #24292f; border-color: #d0d7de;">
      <h2 style="color: #0969da; border-color: #d0d7de;">2. Main Animated Banner (Light Mode)</h2>
      <img src="light.svg" alt="Light Banner">
    </div>

    <div class="section">
      <h2>3. Connect Links Card</h2>
      <img src="connect.svg" alt="Connect Card">
    </div>

    <div class="section">
      <h2>4. Tech Stack Card</h2>
      <img src="stack.svg" alt="Stack Card">
    </div>

    <div class="section">
      <h2>5. Featured Projects Card</h2>
      <img src="projects.svg" alt="Projects Card">
    </div>
  </div>
</body>
</html>
